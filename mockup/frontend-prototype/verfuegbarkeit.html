/* ── UI State ─────────────────────────────────────────────────── */
let filterEmp     = '';
let filterManager = '';
let filterTyp     = '';
let showHoliday   = false;
let editingIdx    = -1;
let myTeamActive  = false;

/* ── Week helpers ─────────────────────────────────────────────── */
function getISOWeek1Monday(year) {
  const jan4 = new Date(year, 0, 4);
  const dow  = jan4.getDay() || 7;
  const mon  = new Date(jan4);
  mon.setDate(jan4.getDate() - (dow - 1));
  return mon;
}

function generateWeeks(year) {
  const weeks = [];
  let d = getISOWeek1Monday(year);
  for (let i = 0; i < 52; i++) {
    weeks.push(new Date(d));
    d = new Date(d.getTime() + 7 * 86400000);
  }
  return weeks;
}

function isoWeekNumber(weekStart) {
  const thu     = new Date(weekStart.getTime() + 3 * 86400000);
  const yearStart = new Date(thu.getFullYear(), 0, 4);
  const ys_dow    = yearStart.getDay() || 7;
  const ys_mon    = new Date(yearStart.getTime() - (ys_dow - 1) * 86400000);
  return Math.round((thu - ys_mon) / (7 * 86400000)) + 1;
}

const WEEKS = generateWeeks(2026);

function getTypeForWeek(empKey, weekStart) {
  const weekEnd = new Date(weekStart.getTime() + 6 * 86400000);
  let result = null;
  for (const e of ENTRIES) {
    if (e.empKey !== empKey) continue;
    if (!showHoliday && e.typeKey === 'holiday') continue;
    if (e.from <= weekEnd && e.to >= weekStart) result = e;
  }
  if (!result) return null;
  return { type: AVAIL_TYPES.find(t => t.key === result.typeKey), project: result.project };
}

function filteredEmployees() {
  return EMPLOYEES.filter(emp => {
    if (filterEmp     && emp.key     !== filterEmp)     return false;
    if (filterManager && emp.manager !== filterManager) return false;
    return true;
  });
}

}

/* ── Render Calendar ──────────────────────────────────────────── */
function renderCalendar() {
  const table = document.getElementById('calendar-table');
  if (!table) return;

  const MONTH_NAMES = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const weekNums    = WEEKS.map(w => isoWeekNumber(w));

  const monthSpans = [];
  let curMonth = -1, curCount = 0;
  WEEKS.forEach(w => {
    const m = w.getMonth();
    if (m !== curMonth) {
      if (curCount > 0) monthSpans.push({ month: curMonth, count: curCount });
      curMonth = m; curCount = 1;
    } else { curCount++; }
  });
  if (curCount > 0) monthSpans.push({ month: curMonth, count: curCount });

  let html = '<thead><tr><th class="cal-name-th" rowspan="2">Mitarbeiter</th>';
  monthSpans.forEach(ms =>
    html += `<th class="cal-month-th" colspan="${ms.count}">${MONTH_NAMES[ms.month]}</th>`
  );
  html += '</tr><tr>';
  weekNums.forEach(wn => html += `<th class="cal-week-th">${wn}</th>`);
  html += '</tr></thead><tbody>';

  filteredEmployees().forEach(emp => {
    html += `<tr><td class="cal-name-cell">${emp.name}<div class="cal-sub">${emp.role}</div></td>`;
    WEEKS.forEach((week, i) => {
      const entry = getTypeForWeek(emp.key, week);
      const type  = entry ? entry.type : null;
      const bg    = type ? `background:${type.color}` : '';
      const cls   = type ? '' : ' empty';
      const proj  = entry && entry.project ? ` — ${entry.project}` : '';
      const tip   = type ? `${type.label}${proj} — KW ${weekNums[i]}` : `Kein Eintrag — KW ${weekNums[i]}`;
      html += `<td class="cal-cell${cls}" style="${bg}" title="${tip}"></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody>';
  table.innerHTML = html;
}

/* ── Render List ──────────────────────────────────────────────── */

  filteredEmployees().forEach(emp => {
    const allEntries = grouped[emp.key].entries;

      .filter(e => !filterTyp || e.typeKey === filterTyp)

          </tr>`;
      });
    }
    html += `</tbody></table></div>`;
  });

  container.innerHTML = html;

  container.querySelectorAll('[data-edit-idx]').forEach(btn => {
    btn.addEventListener('click', () => openEditModal(parseInt(btn.dataset.editIdx)));
  });
}

/* ── Render Overview ──────────────────────────────────────────── */
function overviewCurrentStatus(empKey) {
  const today = new Date(2026, 4, 21);
  for (const e of ENTRIES) {
    if (e.empKey !== empKey) continue;
    if (e.typeKey === 'holiday') continue;
    if (e.from <= today && e.to >= today) {
      const type = AVAIL_TYPES.find(t => t.key === e.typeKey);
      if (!type) continue;
      return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${type.color}20;color:${type.color};border:1px solid ${type.color}50">${type.label}</span>`;
    }
  }
  return '<span style="color:var(--c-text-muted);font-size:12px">—</span>';
}

function renderOverview() {
  const container = document.getElementById('overview-container');
  if (!container) return;

  const emps = filteredEmployees();
  const countEl = document.getElementById('overview-count');
  if (countEl) countEl.textContent = emps.length;

  if (emps.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">○</div><div class="empty-state-title">Keine Mitarbeitenden gefunden</div><div class="empty-state-sub">Versuche einen anderen Filter.</div></div>';
    return;
  }

  const BU_ORDER = ['TCD Süd', 'TCD Nord', 'TCD West'];
  const groups = {};
  BU_ORDER.forEach(bu => { groups[bu] = []; });
  emps.forEach(emp => {
    if (!groups[emp.bu]) groups[emp.bu] = [];
    groups[emp.bu].push(emp);
  });

  let html = '<table class="data-table">' +
    '<thead><tr>' +
    '<th>Name</th><th>Rolle</th><th>Manager</th><th>Aktuell</th>' +
    '<th>Verfügbar ab</th><th>Region</th><th>Mobilität</th><th>Tagessatz</th>' +
    '</tr></thead><tbody>';

  BU_ORDER.forEach(bu => {
    const buEmps = groups[bu];
    if (!buEmps || buEmps.length === 0) return;

    html += `<tr><td colspan="8" style="background:var(--c-bg);font-weight:700;font-size:11px;color:var(--c-text-muted);padding:8px 12px;border-bottom:1px solid var(--c-border);letter-spacing:0.06em;text-transform:uppercase">${bu} &mdash; ${buEmps.length} ${buEmps.length === 1 ? 'Person' : 'Personen'}</td></tr>`;

    buEmps.forEach(emp => {
      const avail = AVAIL_FROM[emp.key] || '—';
      const availStyle = avail === 'Sofort' ? 'color:#2E7D32;font-weight:600' : '';
      html += `<tr style="cursor:pointer" onclick="openPersonDrawer('${emp.key}')" title="${emp.name} bearbeiten">` +
        `<td><div style="font-weight:500">${emp.name}</div>${emp.partTime ? '<div style="font-size:11px;color:#AB47BC">Teilzeit</div>' : ''}</td>` +
        `<td style="font-size:13px">${emp.role}</td>` +
        `<td style="font-size:13px;color:var(--c-text-muted)">${emp.manager}</td>` +
        `<td>${overviewCurrentStatus(emp.key)}</td>` +
        `<td style="font-size:13px;${availStyle}">${avail}</td>` +
        `<td style="font-size:13px">${emp.region}</td>` +
        `<td style="font-size:13px">${emp.mobility}</td>` +
        `<td style="font-size:13px;color:#1976D2;font-weight:500">€${emp.dayRate.toLocaleString('de-DE')}</td>` +
        `</tr>`;
    });
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

/* ── Modal ────────────────────────────────────────────────────── */
const overlay    = document.getElementById('modal-overlay');
const mEmpSel    = document.getElementById('m-employee');
const mTypSel    = document.getElementById('m-type');
const modalTitle = document.getElementById('modal-title');

function closeModal() {
  overlay.classList.remove('open');
  mEmpSel.value = '';
  mTypSel.value = '';
  document.getElementById('m-from').value    = '';
  document.getElementById('m-to').value      = '';
  document.getElementById('m-project').value = '';
  editingIdx = -1;
  modalTitle.textContent = 'Verfügbarkeit eintragen';
}

function openEditModal(idx) {
  const e = ENTRIES[idx];
  if (!e) return;
  editingIdx    = idx;
  mEmpSel.value = e.empKey;
  mTypSel.value = e.typeKey;
  const toISO = d => d.toISOString().split('T')[0];
  document.getElementById('m-from').value    = toISO(e.from);
  document.getElementById('m-to').value      = toISO(e.to);
  document.getElementById('m-project').value = e.project || '';
  modalTitle.textContent = 'Eintrag bearbeiten';
  overlay.classList.add('open');
}

function initAvailabilityModal() {
  EMPLOYEES.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.key;
    opt.textContent = `${e.name} — ${e.role}`;
    mEmpSel.appendChild(opt);
  });
  AVAIL_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.key;
    opt.textContent = t.label;
    mTypSel.appendChild(opt);
  });

  document.getElementById('add-entry-btn')?.addEventListener('click', () => {
    editingIdx = -1;
    modalTitle.textContent = 'Verfügbarkeit eintragen';
    overlay.classList.add('open');
  });

  document.getElementById('modal-close')?.addEventListener('click',  closeModal);
  document.getElementById('modal-cancel')?.addEventListener('click', closeModal);
  overlay?.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.getElementById('modal-save')?.addEventListener('click', () => {
    const empKey  = mEmpSel.value;
    const typeKey = mTypSel.value;
    const fromVal = document.getElementById('m-from').value;
    const toVal   = document.getElementById('m-to').value;
    const project = document.getElementById('m-project').value.trim();

    if (!empKey || !typeKey || !fromVal || !toVal) {
      alert('Bitte alle Pflichtfelder ausfüllen.');
      return;
    }
    if (toVal < fromVal) {
      alert('Das Bis-Datum muss nach dem Von-Datum liegen.');
      return;
    }

    const wasEditing = editingIdx >= 0;
    const newEntry   = { empKey, typeKey, from: new Date(fromVal), to: new Date(toVal), project };

    if (wasEditing) { ENTRIES[editingIdx] = newEntry; }
    else            { ENTRIES.push(newEntry); }

    closeModal();
    renderList();
    renderCalendar();
    renderOverview();
    showSnackbar(wasEditing ? 'Eintrag wurde aktualisiert.' : 'Verfügbarkeit wurde gespeichert.');
  });
}

/* ── Filters Init ─────────────────────────────────────────────── */
function initFilters() {
  const empSel = document.getElementById('f-emp');
  const mgrSel = document.getElementById('f-mgr');
  const typSel = document.getElementById('f-typ');

  [{ value: '', text: 'Alle' }, ...EMPLOYEES.map(e => ({ value: e.key, text: e.name }))].forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.text;
    empSel.appendChild(opt);
  });

  [{ value: '', text: 'Alle' }, ...AVAIL_TYPES.map(t => ({ value: t.key, text: t.label }))].forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.text;
    typSel.appendChild(opt);
  });

  function onFilterChange() {
    filterEmp     = empSel.value;
    filterManager = mgrSel.value;
    filterTyp     = typSel.value;
    // Sync "Mein Team" button state when manager filter changes externally
    myTeamActive = (filterManager === 'Anna Schmidt' && !filterEmp && !filterTyp);
    const btn = document.getElementById('my-team-btn');
    if (btn) btn.textContent = myTeamActive ? 'Alle anzeigen' : '\u{1F465} Mein Team (TCD Süd)';
    renderList();
    renderCalendar();
    renderOverview();
  }

  empSel.addEventListener('change', onFilterChange);
  mgrSel.addEventListener('change', onFilterChange);
  typSel.addEventListener('change', onFilterChange);

  document.getElementById('show-holiday').addEventListener('change', e => {
    showHoliday = e.target.checked;
    renderLegend();
    renderCalendar();
  });

  document.getElementById('my-team-btn')?.addEventListener('click', () => {
    myTeamActive = !myTeamActive;
    const mgrSel = document.getElementById('f-mgr');
    mgrSel.value  = myTeamActive ? 'Anna Schmidt' : '';
    filterManager = mgrSel.value;
    filterEmp     = empSel.value;
    filterTyp     = typSel.value;
    const btn = document.getElementById('my-team-btn');
    btn.textContent = myTeamActive ? 'Alle anzeigen' : '\u{1F465} Mein Team (TCD Süd)';
    renderList();
    renderCalendar();
    renderOverview();
  });
}

var AVATAR_COLORS = { mm:'#1976D2', sk:'#388E3C', fw:'#F57C00', pk:'#7B1FA2', ls:'#00796B', tb:'#795548', jr:'#E53935', mw:'#546E7A', sb2:'#0097A7', lm:'#EC407A', pn:'#1565C0', gv:'#558B2F' };

function openPersonDrawer(empKey) {
  var emp = EMPLOYEES.find(function(e){ return e.key === empKey; });
  if (!emp) return;

  var initials = emp.name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  var avatarEl = document.getElementById('pd-avatar');
  avatarEl.textContent = initials;
  avatarEl.style.background = AVATAR_COLORS[empKey] || '#1976D2';

  document.getElementById('pd-name').textContent = emp.name;
  document.getElementById('pd-role').textContent = emp.role;
  document.getElementById('pd-bu').textContent   = emp.bu + ' · Manager: ' + emp.manager;
  document.getElementById('pd-rate').textContent  = '€' + emp.dayRate.toLocaleString('de-DE') + ' / Tag';

  var avail = AVAIL_FROM[empKey] || '—';
  document.getElementById('pd-avail').textContent = avail;
  document.getElementById('pd-avail').style.color  = avail === 'Sofort' ? '#2E7D32' : 'var(--c-text)';

  var today = new Date(2026, 4, 21);
  var statusHtml = '<span style="color:var(--c-text-muted);font-size:13px">—</span>';
  for (var i = 0; i < ENTRIES.length; i++) {
    var e = ENTRIES[i];
    if (e.empKey !== empKey || e.typeKey === 'holiday') continue;
    if (e.from <= today && e.to >= today) {
      var type = AVAIL_TYPES.find(function(t){ return t.key === e.typeKey; });
      if (type) statusHtml = '<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:' + type.color + '20;color:' + type.color + ';border:1px solid ' + type.color + '50">' + type.label + (e.project ? ' — ' + e.project : '') + '</span>';
      break;
    }
  }
  document.getElementById('pd-status').innerHTML = statusHtml;

  document.getElementById('pd-edit-rate').value      = emp.dayRate;
  document.getElementById('pd-edit-region').value    = emp.region;
  document.getElementById('pd-edit-mobility').value  = emp.mobility;
  document.getElementById('pd-edit-parttime').checked = emp.partTime;
  document.getElementById('pd-edit-avail').value     = (avail !== '—') ? avail : '';
  document.getElementById('pd-edit-notes').value     = '';

  var fmt = function(d){ return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}); };
  var entriesHtml = '';
  ENTRIES.filter(function(e){ return e.empKey === empKey; })
    .sort(function(a,b){ return a.from - b.from; })
    .forEach(function(e) {
      var t = AVAIL_TYPES.find(function(t){ return t.key === e.typeKey; });
      if (!t) return;
      entriesHtml += '<div style="display:flex;align-items:center;gap:8px;font-size:13px">' +
        '<div style="width:10px;height:10px;border-radius:50%;background:' + t.color + ';flex-shrink:0"></div>' +
        '<span style="min-width:130px;color:var(--c-text-muted)">' + fmt(e.from) + ' – ' + fmt(e.to) + '</span>' +
        '<span>' + t.label + (e.project ? ': ' + e.project : '') + '</span>' +
        '</div>';
    });
  document.getElementById('pd-entries').innerHTML = entriesHtml || '<span style="color:var(--c-text-muted);font-size:13px">Keine Einträge vorhanden.</span>';

  // Opportunity history
  var hist = (OPP_HISTORY[empKey] || []).slice().sort(function(a, b) {
    // Sort: active statuses first, then by date descending
    var order = { in_pruefung: 0, angeboten: 1, genehmigt: 2, beauftragt: 3, nicht_beauftragt: 4, abgelehnt: 5 };
    var oa = order[a.status] !== undefined ? order[a.status] : 9;
    var ob = order[b.status] !== undefined ? order[b.status] : 9;
    if (oa !== ob) return oa - ob;
    return b.date.split('.').reverse().join('') > a.date.split('.').reverse().join('') ? -1 : 1;
  });

  var wonCount  = hist.filter(function(h){ return h.status === 'beauftragt' || h.status === 'genehmigt'; }).length;
  var totalDecided = hist.filter(function(h){ return h.status !== 'angeboten' && h.status !== 'in_pruefung'; }).length;
  var hitRate = totalDecided ? Math.round(wonCount / totalDecided * 100) : null;
  document.getElementById('pd-hist-summary').innerHTML =
    hist.length
      ? hist.length + ' Einträge' + (hitRate !== null ? ' &nbsp;·&nbsp; <span style="color:' + (hitRate >= 60 ? '#2E7D32' : '#E65100') + ';font-weight:600">Hit-Rate ' + hitRate + '%</span>' : '')
      : '';

  var histHtml = '';
  if (hist.length === 0) {
    histHtml = '<span style="color:var(--c-text-muted);font-size:13px">Noch keine Opportunity-Matches vorhanden.</span>';
  } else {
    hist.forEach(function(h) {
      var sc = HIST_STATUS_CONFIG[h.status] || HIST_STATUS_CONFIG['angeboten'];
      var scoreColor = h.score >= 80 ? '#2E7D32' : h.score >= 65 ? '#E65100' : '#C62828';
      histHtml +=
        '<div style="padding:10px 12px;border:1px solid var(--c-border);border-radius:6px;background:#FAFAFA">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px">' +
            '<div style="font-size:13px;font-weight:600;color:var(--c-text-primary);line-height:1.3">' + h.title + '</div>' +
            '<span style="padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;background:' + sc.bg + ';color:' + sc.col + '">' + sc.label + '</span>' +
          '</div>' +
          '<div style="display:flex;gap:14px;font-size:12px;color:var(--c-text-muted);flex-wrap:wrap;align-items:center">' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="font-size:10px">🏢</span>' + h.client + '</span>' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="font-size:10px">📅</span>' + h.date + '</span>' +
            (h.score ? '<span style="font-weight:700;color:' + scoreColor + '">Score ' + h.score + '</span>' : '') +
          '</div>' +
        '</div>';
    });
  }
  document.getElementById('pd-opp-history').innerHTML = histHtml;

  document.getElementById('person-overlay').classList.add('open');
  document.getElementById('person-drawer').classList.add('open');
}

function closePersonDrawer() {
  document.getElementById('person-drawer').classList.remove('open');
  document.getElementById('person-overlay').classList.remove('open');
}

document.getElementById('pd-close').addEventListener('click', closePersonDrawer);
document.getElementById('pd-cancel-btn').addEventListener('click', closePersonDrawer);
document.getElementById('person-overlay').addEventListener('click', closePersonDrawer);
document.getElementById('pd-save-btn').addEventListener('click', function() {
  showSnackbar('Personendaten gespeichert.');
  closePersonDrawer();
});

/* ── Excel Export ─────────────────────────────────────────────── */
document.getElementById('export-excel-btn')?.addEventListener('click', function() {
  showSnackbar('Excel-Export wird vorbereitet… Download startet in Kürze.');
});

/* ── Boot ─────────────────────────────────────────────────────── */
renderLegend();
renderCalendar();
renderList();
renderOverview();
initAvailabilityModal();
initFilters();
